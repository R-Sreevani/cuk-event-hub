<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin</title>
</head>
<body style="font-family: Arial; margin: 0;">
    <div style="background: #003366; color: white; padding: 20px; text-align: center;">
        <h1>User Management</h1>
        <p>Admin Panel - CUK Event Hub</p>
    </div>
    
    <div style="background: #00509E; padding: 15px; text-align: center;">
        <a href="admin-dashboard.html" style="color: white; margin: 0 15px; text-decoration: none; background: #003366; padding: 10px 20px; border-radius: 5px;">
            ← Dashboard
        </a>
        <a href="notifications.html" class="nav-btn" style="position: relative;">
    <i class="fas fa-bell"></i> Notifications
    <span class="notification-badge" style="display: none; position: absolute; top: -5px; right: -5px; background: #dc3545; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center;">0</span>
</a>

    </div>
    
    <div style="max-width: 1200px; margin: 30px auto; padding: 20px;">
        <div style="background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            <h2>All Users (2,148)</h2>
            <p>Manage student and staff accounts</p>
            
            <div style="margin: 20px 0;">
                <input type="text" placeholder="Search users..." style="padding: 10px; width: 300px;">
                <button style="background: #FFCC00; color: #003366; padding: 10px 20px; border: none; border-radius: 5px; margin-left: 10px;">
                    Search
                </button>
            </div>
            
            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <tr style="background: #003366; color: white;">
                    <th style="padding: 15px;">User ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
                <tr style="border-bottom: 1px solid #ddd;">
                    <td style="padding: 15px;">CUK20240001</td>
                    <td>Rahul Sharma</td>
                    <td>rahul@cuk.ac.in</td>
                    <td>Student</td>
                    <td><button>View</button> <button style="background: #dc3545; color: white;">Disable</button></td>
                </tr>
                <tr style="border-bottom: 1px solid #ddd;">
                    <td style="padding: 15px;">CUK20240002</td>
                    <td>Priya Patel</td>
                    <td>priya@cuk.ac.in</td>
                    <td>Student</td>
                    <td><button>View</button> <button style="background: #dc3545; color: white;">Disable</button></td>
                </tr>
            </table>
        </div>
    </div>
    
    <script>
        if(!localStorage.getItem('admin')) {
            window.location.href = 'admin-login.html';
        }
    </script>
    <script>
    // Initialize integration on every page
    document.addEventListener('DOMContentLoaded', function() {
        // Sync data from all pages
        if (window.cukIntegration) {
            cukIntegration.syncAllData();
            cukIntegration.updateNotificationBadge();
            cukIntegration.updateDashboard();
            cukIntegration.updateUserUI();
        }
    });
</script>
</body>
</html>
