<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - CUK Event Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Copy the styles from your existing event-register.html */
        /* ... keep your existing styles ... */
    </style>
</head>
<body>
    <!-- Copy your existing HTML structure -->
    <!-- ... -->

    <script>
        // Same event database
        const EVENTS = [
            {
                id: 1,
                title: "National Conference on Artificial Intelligence",
                category: "Conference",
                date: "2024-03-15",
                time: "10:00 AM - 5:00 PM",
                venue: "Main Auditorium",
                fee: "₹500",
                capacity: 200,
                registered: 145
            },
            {
                id: 2,
                title: "Cultural Fest 2024",
                category: "Cultural",
                date: "2024-03-20",
                time: "2:00 PM - 9:00 PM",
                venue: "Open Air Theatre",
                fee: "Free",
                capacity: 500,
                registered: 320
            },
            {
                id: 3,
                title: "Inter-Department Sports Meet",
                category: "Sports",
                date: "2024-03-25",
                time: "9:00 AM - 6:00 PM",
                venue: "Sports Complex",
                fee: "₹100",
                capacity: 400,
                registered: 210
            }
        ];

        // Get event ID from URL
        function getEventIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') ? parseInt(urlParams.get('id')) : null;
        }

        // Load event data
        function loadEventData() {
            const eventId = getEventIdFromUrl();
            
            if (!eventId) {
                alert('No event selected');
                window.location.href = 'events.html';
                return;
            }
            
            // Find the event
            const event = EVENTS.find(e => e.id === eventId);
            
            if (event) {
                displayEventDetails(event);
            } else {
                alert('Event not found');
                window.location.href = 'events.html';
            }
        }

        // Display event details in registration form
        function displayEventDetails(event) {
            document.getElementById('event-name').textContent = event.title;
            // ... rest of your display logic
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadEventData();
        });
    </script>
</body>
</html>
