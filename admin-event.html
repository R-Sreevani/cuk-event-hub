<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; }
        .header { background: #003366; color: white; padding: 20px; text-align: center; }
        .navbar { background: #00509E; padding: 15px; text-align: center; }
        .nav-btn { color: white; text-decoration: none; margin: 0 15px; padding: 10px 20px; display: inline-block; }
        .nav-btn:hover { background: #003366; border-radius: 5px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #003366; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #ddd; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 0 5px; }
        .btn-edit { background: #FFCC00; color: #003366; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-create { background: #FFCC00; color: #003366; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Manage Events - Admin Panel</h1>
        <p>CUK Event Management System</p>
    </div>
    
    <div class="navbar">
        <a href="admin-dashboard.html" class="nav-btn">← Dashboard</a>
        <a href="admin-event.html" class="nav-btn">Events</a>
        <a href="admin-user.html" class="nav-btn">Users</a>
        <a href="notifications.html" class="nav-btn" style="position: relative;">
            <i class="fas fa-bell"></i> Notifications
            <span class="notification-badge">0</span>
        </a>
        <button onclick="logout()" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            Logout
        </button>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>Event Management</h2>
            <button class="btn-create" onclick="createEvent()">
                + Create New Event
            </button>
            
            <table>
                <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Date</th>
                        <th>Venue</th>
                        <th>Registrations</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>AI Conference</td>
                        <td>Mar 15, 2024</td>
                        <td>Auditorium</td>
                        <td>120/200</td>
                        <td><span style="color: #28a745;">Active</span></td>
                        <td>
                            <button class="btn btn-edit">Edit</button>
                            <button class="btn btn-delete">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Cultural Fest</td>
                        <td>Mar 20, 2024</td>
                        <td>Open Air Theatre</td>
                        <td>450/500</td>
                        <td><span style="color: #28a745;">Active</span></td>
                        <td>
                            <button class="btn btn-edit">Edit</button>
                            <button class="btn btn-delete">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        function createEvent() {
            alert('Create Event form - In a real app, this would open a form to create a new event');
            window.location.href = 'admin-create-event.html';
        }
        
        // Check admin login
        if(!localStorage.getItem('admin')) {
            window.location.href = 'admin-login.html';
        }
        
        function logout() {
            if(confirm('Logout?')) {
                localStorage.removeItem('admin');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
