<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: Arial, sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; }
        .header { background: #003366; color: white; padding: 20px; text-align: center; }
        .navbar { background: #00509E; padding: 15px; text-align: center; }
        .nav-btn { color: white; text-decoration: none; margin: 0 15px; padding: 10px 20px; display: inline-block; }
        .nav-btn:hover { background: #003366; border-radius: 5px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #003366; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #ddd; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; margin: 0 5px; }
        .btn-view { background: #003366; color: white; }
        .btn-disable { background: #dc3545; color: white; }
        .notification-badge { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>User Management</h1>
        <p>Admin Panel - CUK Event Hub</p>
    </div>
    
    <div class="navbar">
        <a href="admin-dashboard.html" class="nav-btn">← Dashboard</a>
        <a href="admin-user.html" class="nav-btn">Users</a>
        <a href="admin-event.html" class="nav-btn">Events</a>
        <a href="notifications.html" class="nav-btn" style="position: relative;">
            <i class="fas fa-bell"></i> Notifications
            <span class="notification-badge">0</span>
        </a>
        <button onclick="logout()" style="background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
            Logout
        </button>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>All Users <span style="color: #666; font-size: 16px;">(2,148 total)</span></h2>
            <p>Manage student and staff accounts</p>
            
            <div style="margin: 20px 0; display: flex; gap: 10px;">
                <input type="text" placeholder="Search users..." style="padding: 10px; width: 300px; border: 2px solid #ddd; border-radius: 5px;">
                <button style="background: #FFCC00; color: #003366; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
                    Search
                </button>
                <button style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
                    + Add User
                </button>
            </div>
            
            <table>
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                <tr>
                    <td>CUK20240001</td>
                    <td>Rahul Sharma</td>
                    <td>rahul@cuk.ac.in</td>
                    <td>Student</td>
                    <td><span style="color: #28a745;">Active</span></td>
                    <td>
                        <button class="btn btn-view">View</button>
                        <button class="btn btn-disable">Disable</button>
                    </td>
                </tr>
                <tr>
                    <td>CUK20240002</td>
                    <td>Priya Patel</td>
                    <td>priya@cuk.ac.in</td>
                    <td>Student</td>
                    <td><span style="color: #28a745;">Active</span></td>
                    <td>
                        <button class="btn btn-view">View</button>
                        <button class="btn btn-disable">Disable</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        // Check admin login
        if(!localStorage.getItem('admin')) {
            window.location.href = 'admin-login.html';
        }
        
        function logout() {
            if(confirm('Logout?')) {
                localStorage.removeItem('admin');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
