<!-- Use this code - save as either admin-login.html or admin_login.html based on your needs -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CUK Event Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS from previous message - same as above */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial; }
        body {
            background: linear-gradient(135deg, #003366 0%, #001f3f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .admin-icon {
            font-size: 60px;
            color: #dc3545;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 { color: #003366; text-align: center; margin-bottom: 10px; }
        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 25px 0;
            border-radius: 5px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #003366;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #003366;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        .demo-creds {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 14px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00509E;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div style="background: white; padding: 15px; text-align: center;">
        <h1 style="color: #003366;">CUK Event Hub - Admin Portal</h1>
    </div>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="admin-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            
            <h2>Administrator Login</h2>
            <p style="text-align: center; color: #666;">Restricted access only</p>

            <div class="warning">
                <i class="fas fa-exclamation-triangle" style="color: #856404;"></i>
                <strong>Authorized Personnel Only</strong><br>
                This system is for CUK administrators.
            </div>

            <form id="loginForm" onsubmit="handleAdminLogin(event)">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" value="admin" placeholder="Enter username" required>
                </div>
                
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" value="admin123" placeholder="Enter password" required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                </button>
            </form>

            <div class="demo-creds">
                <p><strong>Demo Credentials:</strong></p>
                <p>admin / admin123</p>
                <p>cukadmin / cuk@2024</p>
            </div>

            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Homepage
            </a>
        </div>
    </div>

    <div style="background: #003366; color: white; text-align: center; padding: 20px;">
        <p>Central University of Karnataka | Admin Portal</p>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            // Valid credentials
            const validUsers = [
                { user: 'admin', pass: 'admin123', name: 'Administrator', role: 'admin' },
                { user: 'cukadmin', pass: 'cuk@2024', name: 'CUK Admin', role: 'superadmin' },
                { user: 'test', pass: 'test123', name: 'Test Admin', role: 'admin' }
            ];
            
            const matched = validUsers.find(u => u.user === username && u.pass === password);
            
            if (matched) {
                // Store admin session
                localStorage.setItem('admin', JSON.stringify({
                    username: username,
                    name: matched.name,
                    role: matched.role,
                    loginTime: new Date().toISOString()
                }));
                
                // Redirect to dashboard
                window.location.href = 'admin-dashboard.html';
            } else {
                alert('Invalid credentials! Try: admin / admin123');
            }
        }
    </script>
</body>
</html>
